# main 브랜치에 글이 올라가면 자동으로 사이트를 만들어 GitHub Pages에 올려요.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "1"
      NEXT_PUBLIC_BASE_PATH: /my-blog
      NEXT_PUBLIC_SITE_URL: https://bluedogseojoon.github.io/my-blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 사이트가 올라간 뒤, 새로 올라간 글을 네이버·빙에 바로 알려요. (실패해도 사이트에는 영향 없어요)
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/indexnow.mjs ${{ github.event.before || 'all' }} ${{ github.sha }}
        env:
          NEXT_PUBLIC_SITE_URL: https://bluedogseojoon.github.io/my-blog
